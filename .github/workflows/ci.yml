name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false

      matrix:
        include:
          - os: windows-latest
            preset: windows-msvc-debug
            msvc: true

          - os: windows-latest
            preset: windows-msvc-release
            msvc: true

          - os: ubuntu-latest
            preset: linux-gcc-debug
            msvc: false

          - os: ubuntu-latest
            preset: linux-gcc-release
            msvc: false

          - os: ubuntu-latest
            preset: linux-clang-debug
            msvc: false

          - os: ubuntu-latest
            preset: linux-clang-asan
            msvc: false

          - os: ubuntu-latest
            preset: linux-clang-tsan
            msvc: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup MSVC
        if: matrix.msvc
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Vulkan SDK on Windows
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff # v1.2
        with:
          version: '1.4.309.0'
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libxkbcommon-dev \
            xorg-dev

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
